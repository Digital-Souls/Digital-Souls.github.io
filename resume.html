<!DOCTYPE html>
<html>

<head>
    <title> Yazan Resume </title>
    <link rel="stylesheet" href="simpleStyle.css">
</head>

<body>
    <header>
        <div class="header">
            <h1 style="color: white; padding-left: 5%;"> My Resume </h1>
        </div>
        <div>

        </div>
        <div class="return">
            <a href="index.html">
                <button> Return </button>
            </a> 
        </div>
    </header>

    


    <main>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
        <div id="pdf-container"></div>
            
        <script>
          pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        
          async function renderPDF() {
            const pdf = await pdfjsLib.getDocument('resume 2 col.pdf').promise;
            const container = document.getElementById('pdf-container');
        
            for (let i = 1; i <= pdf.numPages; i++) {
              const page = await pdf.getPage(i);
              const viewport = page.getViewport({ scale: 5 });
            
              const canvas = document.createElement('canvas');
              canvas.width = viewport.width;
              canvas.height = viewport.height;
              canvas.style.display = 'block';
              canvas.style.width = '100%';
              container.appendChild(canvas);
            
              await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
            }
          }
      
          renderPDF();
        </script>
    </main>


    <script src="indexvalidation.js"></script>

</body>

</html>
